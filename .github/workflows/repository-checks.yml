name: Core repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify repository policy
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f release.properties
          test -x tests/linux-modern/test-all.sh
          if test -n "$(find tests/linux-modern -type f -name '*.sh' ! -perm -u+x -print -quit)"; then
            echo 'Maintained Linux test scripts must be executable.' >&2
            exit 1
          fi
          test -x sagetv-dev.sh
          test -x dev.sh
          test -x update.sh
          git diff --check

      - name: Check maintained shell entry points
        shell: bash
        run: |
          set -euo pipefail
          bash -n sagetv-dev.sh dev.sh update.sh
          find tests/linux-modern -type f -name '*.sh' -print0 \
            | xargs -0 -r bash -n

      - name: Confirm generated and private runtime state is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e output
          test ! -e Sage.properties
          test ! -e Wiz.bin
          if find artifacts -mindepth 1 -type f ! -path 'artifacts/downloads/.gitkeep' -print -quit 2>/dev/null | grep -q .; then
            echo 'Generated artifacts must not be committed.' >&2
            exit 1
          fi

  # A complete Core build intentionally is not duplicated on the GitHub host.
  # Release candidates must pass `./sagetv-dev.sh all` through the sibling
  # opensagetv-vibe-build-env checkout, which builds and tests inside Ubuntu
  # 26.04 and writes output/BUILD_REPORT.md.
